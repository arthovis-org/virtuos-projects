# The desktop app (apps/configurator-desktop): on every change to it or the configurator,
# build it and run its smoke test; on a version tag (v0.2.0, matching its package.json),
# also build the Windows installer and publish it as a GitHub release, where installed
# copies find their updates.
name: configurator-desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/configurator-desktop/**'
      - 'apps/product-configurator/**'
      - '.github/workflows/configurator-desktop.yml'
  pull_request:
    paths:
      - 'apps/configurator-desktop/**'
      - '.github/workflows/configurator-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/configurator-desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/product-configurator/package-lock.json
            apps/configurator-desktop/package-lock.json
      - run: npm ci
        working-directory: apps/product-configurator
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: npm test
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, but package.json says $version"; exit 1; }
      - name: Installer
        run: npx electron-builder --win --publish never
      # Published here, not by electron-builder: it uploads its files at once, and each upload
      # creating the release raced (v0.1.1 lost its installer and latest.yml). One step creates
      # the release with all three files: the installer, its block map (for small updates) and
      # latest.yml, which installed copies read to find the update.
      - name: Publish the release (on a version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=(release/VIRTUOS-Configurator-Setup-"$version".exe release/VIRTUOS-Configurator-Setup-"$version".exe.blockmap release/latest.yml)
          ls -l "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            notes="Windows installer. Installed copies update themselves to this version."
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --title "VIRTUOS Configurator $version" --notes "$notes"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: apps/configurator-desktop/release/*.exe
          retention-days: 14
