# Checks for apps/product-configurator: types, lint, formatting, unit tests, a production
# build and the browser smoke test (in the runner's installed Chrome).
name: product-configurator

on:
  push:
    branches: [main]
    paths: ['apps/product-configurator/**', '.github/workflows/product-configurator.yml']
  pull_request:
    paths: ['apps/product-configurator/**', '.github/workflows/product-configurator.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/product-configurator

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/product-configurator/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run inspect -- smart-desk
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/product-configurator/test-results/
          retention-days: 7
