# Builds every project under apps/ plus the gallery and hubs (scripts/build-site.mjs) and
# publishes them as one GitHub Pages site: https://arthovis-org.github.io/virtuos-projects/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/*/package-lock.json
      # Only projects with a build step need their dependencies; static ones are copied.
      - run: npm ci
        working-directory: apps/product-configurator
      - run: node scripts/build-site.mjs
        env:
          SITE_BASE: /virtuos-projects/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
