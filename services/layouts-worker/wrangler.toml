# The layouts Worker (Cloudflare). Deploy: `npx wrangler deploy` in this folder.
name = "virtuos-layouts"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to save and open layouts: the published site, the desktop app (app://configurator)
# and local development servers.
ALLOWED_ORIGINS = "https://arthovis-org.github.io,app://configurator,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://127.0.0.1:4180"

[[d1_databases]]
binding = "DB"
database_name = "virtuos-layouts"
database_id = "d1fd4e5c-40f1-43a5-bb1e-b04500f21319"

# Workers AI, for planning command centers (/plan). Free daily allowance on the free plan.
[ai]
binding = "AI"
